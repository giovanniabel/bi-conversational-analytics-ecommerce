[project]
name = "ai-analytics"
version = "0.1.0"
description = "Conversational analytics over ClickHouse using LangChain + LangGraph"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.36.0",
    "clickhouse-connect>=0.7.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    # LLM orchestration
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "pydantic>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
