name: bi-ai

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-local
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ch_logs:/var/log/clickhouse-server
      # Runs ONLY against a fresh (empty) ch_data volume — i.e. the first
      # time this stack is started on a machine. On an existing volume
      # (like the one already populated on this machine) ClickHouse skips
      # docker-entrypoint-initdb.d entirely, so existing data is never
      # touched, reloaded, or overwritten.
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./data/olist:/olist-data:ro
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping" ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  ai-analytics:
    build:
      context: ./ai-analytics
      dockerfile: Dockerfile
    container_name: streamlit-analytics
    ports:
      - "8501:8501"
    # Loads LLM_PROVIDER/LLM_API_KEY/LLM_MODEL, CLICKHOUSE_USER/PASSWORD/DATABASE,
    # etc. straight from the app's own .env — same values `uv run streamlit
    # run app.py` would use locally. CLICKHOUSE_HOST is the one thing that
    # legitimately differs between host and container, so it's overridden
    # below (Compose's `environment:` wins over `env_file:` for the same key).
    env_file:
      - ./ai-analytics/.env
    environment:
      CLICKHOUSE_HOST: clickhouse
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ch_data:
  ch_logs:
